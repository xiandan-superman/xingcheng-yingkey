<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>登录 · 星橙·映钥</title>
  <link rel="stylesheet" href="login.css">

</head>
<body>
  <main class="login">
    <img class="brand" src="../../assets/brand.png" alt="" width="56" height="56">
    <h1>星橙·映钥</h1>

      <button id="cancel" class="cancel" type="button" hidden>取消</button>
